<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#131722" />
  <title>Chart Studio — วิเคราะห์กราฟ + Backtest</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="vendor/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <!-- Top toolbar -->
  <header class="toolbar">
    <button id="menuToggle" class="icon-btn" aria-label="เมนู">☰</button>
    <div class="brand">📈 Chart Studio</div>

    <div class="tb-group">
      <select id="sourceSelect" class="tb-input" title="แหล่งข้อมูล"></select>
      <input id="symbolInput" class="tb-input symbol" list="symbolList" placeholder="สัญลักษณ์ เช่น BTCUSDT" />
      <datalist id="symbolList"></datalist>
    </div>

    <div class="tb-group intervals" id="intervalGroup"></div>

    <button id="loadBtn" class="primary-btn">โหลด</button>
    <span id="statusDot" class="status-dot" title="สถานะ"></span>
  </header>

  <div class="layout">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-head">
          <h3>Indicators</h3>
          <button id="addIndicatorBtn" class="mini-btn">+ เพิ่ม</button>
        </div>
        <ul id="activeIndicators" class="active-list"></ul>
      </div>

      <div class="sidebar-section">
        <h3>Backtest</h3>
        <label class="field">
          <span>กลยุทธ์</span>
          <select id="strategySelect" class="tb-input full"></select>
        </label>
        <p id="strategyDesc" class="hint"></p>
        <div id="strategyParams" class="param-grid"></div>
        <label class="field half-row">
          <span>ทุนเริ่ม</span>
          <input id="initialCash" class="tb-input full" type="number" value="10000" />
        </label>
        <label class="field half-row">
          <span>ค่าธรรมเนียม</span>
          <input id="commission" class="tb-input full" type="number" step="0.0001" value="0.001" />
        </label>
        <button id="runBacktestBtn" class="primary-btn full">▶ รัน Backtest</button>
        <div id="backtestResult" class="bt-result"></div>
      </div>
    </aside>
    <div id="backdrop" class="backdrop"></div>

    <!-- Chart area -->
    <main class="chart-area">
      <div id="chartHeader" class="chart-header">
        <span id="chartTitle">—</span>
        <span id="ohlcLegend" class="ohlc-legend"></span>
      </div>
      <div id="mainChart" class="main-chart"></div>
      <div id="panes" class="panes"></div>
      <div id="loading" class="loading hidden"><div class="spinner"></div></div>
    </main>
  </div>

  <!-- Add-indicator modal -->
  <div id="indicatorModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3>เพิ่ม Indicator</h3>
        <button class="icon-btn" id="closeModal">✕</button>
      </div>
      <input id="indicatorSearch" class="tb-input full" placeholder="ค้นหา indicator..." />
      <div id="indicatorCatalog" class="catalog-grid"></div>
    </div>
  </div>

  <!-- Indicator settings modal -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-box small">
      <div class="modal-head">
        <h3 id="settingsTitle">ตั้งค่า</h3>
        <button class="icon-btn" id="closeSettings">✕</button>
      </div>
      <div id="settingsParams" class="param-grid"></div>
      <div class="modal-actions">
        <button id="applySettings" class="primary-btn">บันทึก</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/chart.js"></script>
  <script src="js/indicators.js"></script>
  <script src="js/backtest.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
